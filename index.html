<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Doit rester aligné sur --bg de style.css : c'est la couleur de la barre
         d'adresse sur Android, un écart se voit tout de suite. -->
    <meta name="theme-color" content="#090c11" />
    <!-- Favicon en data-URI : une requête réseau de moins (§2.5, 4G dégradée). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E"
    />
    <title>Dhaw — coupures d'électricité en Tunisie</title>
    <meta
      name="description"
      content="Où l'électricité est coupée en Tunisie, en temps réel. Signalé par les habitants, zone par zone."
    />
  </head>
  <body>
    <!-- App shell. Rendered by JS; noscript fallback stays readable during an outage. -->
    <div id="app"></div>

    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif">
        <h1>Dhaw</h1>
        <p>
          Cette page a besoin de JavaScript pour afficher l'état de ta zone.
          Active-le, ou réessaie quand ta connexion est meilleure.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
